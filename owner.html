<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Platform Owner · JengaEdu</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:16px system-ui;margin:30px;background:#f6f8fc;color:#17233b}main{max-width:900px;margin:auto;background:white;padding:28px;border-radius:16px}input{padding:10px;width:100%;box-sizing:border-box;margin:5px 0}button{padding:9px 12px;margin:3px;border:0;border-radius:7px;background:#4564f5;color:#fff;cursor:pointer}.danger{background:#b42318}table{width:100%;border-collapse:collapse;margin-top:18px}td,th{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left}.pending{color:#9a6700}.active{color:#087d70}.suspended{color:#b42318}#gate{max-width:420px}</style></head><body><main id="gate"><h1>Platform owner</h1><p>Only the account listed in <code>platform_admins</code> can manage school approval.</p><input id="email" type="email" placeholder="Owner email"><input id="password" type="password" placeholder="Password"><button onclick="signIn()">Sign in</button><p id="m"></p></main><main id="panel" hidden><h1>School approvals</h1><button onclick="loadSchools()">Refresh</button><button onclick="client.auth.signOut();location.reload()">Sign out</button><table><thead><tr><th>School</th><th>County</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></main><script>const CONFIG={url:"https://jtroizfsybwhjqyhvdyd.supabase.co",anonKey:"sb_publishable_aN0zmdalip6OqvVzSFIafw_qF3Rp1p0"};const client=supabase.createClient(CONFIG.url,CONFIG.anonKey);async function signIn(){const{error}=await client.auth.signInWithPassword({email:email.value,password:password.value});if(error){m.textContent=error.message;return}const{data,error:e}=await client.from('platform_admins').select('user_id').maybeSingle();if(e||!data){await client.auth.signOut();m.textContent='This account is not the platform owner.';return}gate.hidden=true;panel.hidden=false;loadSchools()}async function loadSchools(){const{data,error}=await client.from('schools').select('id,name,county,status,created_at').order('created_at',{ascending:false});if(error){alert(error.message);return}rows.innerHTML=data.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.county||'—')}</td><td class="${s.status}">${s.status}</td><td>${s.status==='pending'?`<button onclick="setStatus('${s.id}','active')">Approve</button><button class="danger" onclick="setStatus('${s.id}','rejected')">Reject</button>`:''}${s.status==='active'?`<button class="danger" onclick="setStatus('${s.id}','suspended')">Suspend</button>`:''}${s.status==='suspended'?`<button onclick="setStatus('${s.id}','active')">Re-approve</button>`:''}</td></tr>`).join('')}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function setStatus(id,status){if(!confirm(`Change this school to ${status}?`))return;const{error}=await client.rpc('set_school_status',{p_school_id:id,p_status:status});if(error)alert(error.message);else loadSchools()}</script></body></html>
