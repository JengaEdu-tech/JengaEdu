<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JengaEdu Parent & Learner Portal</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:Inter,system-ui,Arial;color:#172033;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;padding:24px}.wrap{max-width:900px;margin:auto}.brand{background:#123b68;color:white;padding:24px;border-radius:18px}.card{background:white;border:1px solid #dfe6ef;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 8px 24px #152b4810}input,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #cbd5e1;width:100%;margin:6px 0}button{background:#1769aa;color:white;border:0;font-weight:700;cursor:pointer}.muted{color:#64748b}.error{color:#b42318}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
</style></head><body><main class="wrap"><header class="brand"><h1>JengaEdu</h1><p>Parent & Learner Portal</p></header>
<section class="card" id="login"><h2>Sign in securely</h2><p class="muted">Use the verified email address invited by your school.</p><input id="email" type="email" autocomplete="username" placeholder="Email address"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button onclick="signIn()">Sign in</button><button style="background:#e8eef6;color:#123b68" onclick="createAccount()">Create parent / learner account</button><p id="loginStatus" class="muted"></p></section>
<section id="portal" hidden><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h2>Linked learner profiles</h2><button style="width:auto" onclick="signOut()">Sign out</button></div><div id="profiles"></div></div></section>
</main><script>
const SUPABASE_URL="https://jtroizfsybwhjqyhvdyd.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_aN0zmdalip6OqvVzSFIafw_qF3Rp1p0";
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const params=new URLSearchParams(location.search);
const schoolId=params.get("school");
const inviteToken=params.get("portal_invite");
const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function createAccount(){const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;const status=document.getElementById("loginStatus");if(!email||password.length<8){status.textContent="Enter your invited email and a password of at least 8 characters.";return}const {error}=await supabase.auth.signUp({email,password,options:{emailRedirectTo:location.href}});status.textContent=error?error.message:"Account created. Check your email to verify the account, then return here and sign in.";}
async function signIn(){const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
 const status=document.getElementById("loginStatus");status.textContent="Signing in…";
 const {error}=await supabase.auth.signInWithPassword({email,password});if(error){status.textContent=error.message;status.className="error";return}await loadPortal();}
async function loadPortal(){const {data:{user}}=await supabase.auth.getUser();if(!user)return;
 if(!schoolId){document.getElementById("loginStatus").textContent="The school link is missing. Ask the school for the complete invitation link.";return;}
 if(inviteToken){const {error}=await supabase.rpc("accept_school_portal_invitation",{p_token:inviteToken});if(error){document.getElementById("loginStatus").textContent=error.message;return}history.replaceState({},document.title,location.pathname+"?school="+encodeURIComponent(schoolId));}
 const {data,error}=await supabase.rpc("get_my_portal_learners",{p_school_id:schoolId});
 if(error){document.getElementById("loginStatus").textContent=error.message;return}
 document.getElementById("login").hidden=true;document.getElementById("portal").hidden=false;
 document.getElementById("profiles").innerHTML=(data||[]).map(l=>`<article class="card"><h3>${safe(l.name)}</h3><div class="grid"><p><b>Admission:</b><br>${safe(l.adm)}</p><p><b>Class:</b><br>${safe(l.class)}</p><p><b>Stream:</b><br>${safe(l.stream||"—")}</p></div></article>`).join("")||"<p>No learner profile is linked to this account yet. Contact the school administrator.</p>";
}
async function signOut(){await supabase.auth.signOut();location.reload()}
supabase.auth.getSession().then(({data})=>{if(data.session)loadPortal()});
</script></body></html>
