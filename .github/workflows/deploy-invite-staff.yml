
name: Deploy JengaEdu Staff Invitations

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/invite-staff/**'
      - '.github/workflows/deploy-invite-staff.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout JengaEdu
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy invite-staff function
        run: supabase functions deploy invite-staff --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
