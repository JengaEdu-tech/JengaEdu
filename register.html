<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register School · JengaEdu</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:16px system-ui;background:#f6f8fc;color:#17233b;margin:0;display:grid;place-items:center;min-height:100vh}.box{background:white;padding:32px;border-radius:20px;max-width:600px;width:calc(100% - 40px);margin:20px;box-shadow:0 20px 60px #17233b12}.tag{background:#e7f8f4;color:#087d70;padding:7px 12px;border-radius:99px;font-size:12px;font-weight:700}label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d8deea;border-radius:9px}button{margin-top:18px;width:100%;padding:12px;border:0;border-radius:9px;background:#4564f5;color:white;font-weight:700;cursor:pointer}.msg{margin-top:14px;padding:10px;border-radius:8px;display:none}.err{background:#fee2e2;color:#991b1b}.ok{background:#e7f8f4;color:#087d70}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><main class="box"><span class="tag">SCHOOL ONBOARDING</span><h1>Register your school</h1><p>Your school is ready to use immediately after registration. The platform owner can still view and manage your school in the Supabase dashboard.</p><form id="f"><div class="grid"><div><label>School name</label><input id="name" required></div><div><label>School type</label><select id="type"><option>Comprehensive</option><option>Primary</option><option>Secondary</option><option>Junior School</option><option>ECDE</option></select></div><div><label>County</label><input id="county"></div><div><label>Country</label><input id="country" value="Kenya"></div><div><label>Administrator name</label><input id="adminName" required></div><div><label>Administrator email</label><input id="email" type="email" required></div><div><label>Administrator phone number</label><input id="phone" type="tel" inputmode="tel" placeholder="0712345678 or +254712345678" required></div></div><label>Password (minimum 8 characters)</label><input id="password" type="password" minlength="8" required><button id="submit">Create school account</button></form><div id="msg" class="msg"></div><p><a href="index.html">← Back</a> · <a href="workspace.html">School login</a></p></main><script>
const CONFIG={url:"https://jtroizfsybwhjqyhvdyd.supabase.co",anonKey:"sb_publishable_aN0zmdalip6OqvVzSFIafw_qF3Rp1p0"};const client=supabase.createClient(CONFIG.url,CONFIG.anonKey);const msg=document.getElementById('msg');function say(t,ok){msg.textContent=t;msg.className='msg '+(ok?'ok':'err');msg.style.display='block'}
function normalizePhone(value){let n=String(value||'').trim().replace(/[\s().-]/g,'');if(n.startsWith('00'))n='+'+n.slice(2);if(/^0[17]\d{8}$/.test(n))n='+254'+n.slice(1);else if(/^254[17]\d{8}$/.test(n))n='+'+n;else if(/^[17]\d{8}$/.test(n))n='+254'+n;if(/^\+254[17]\d{8}$/.test(n))return n;return ''}document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const phone=normalizePhone(document.getElementById('phone').value);if(!phone){say('Enter a valid Kenyan phone number, for example 0712345678 or +254712345678.',false);return}const b=document.getElementById('submit');b.disabled=true;b.textContent='Creating…';try{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {data,error}=await client.auth.signUp({email,password,options:{data:{full_name:document.getElementById('adminName').value.trim(),jenga_school_application:true,school_name:document.getElementById('name').value.trim(),school_type:document.getElementById('type').value,school_county:document.getElementById('county').value.trim(),school_country:document.getElementById('country').value.trim()||'Kenya',phone}}}});if(error)throw error;if(!data.user)throw new Error('Account creation did not return a user.');say('School account created successfully. You can now sign in to your school workspace using the email and password you just created.',true);setTimeout(()=>location.href='workspace.html',900)}catch(err){say(err.message||String(err),false)}finally{b.disabled=false;b.textContent='Create school account'}});
</script></body></html>
